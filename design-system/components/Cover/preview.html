<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DULI.KR</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; padding:0; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .music { fill:var(--music-mark); }
  .accent { fill:var(--accent); }
  .ink { fill:var(--cover-ink); }
  .gray { fill:var(--cover-bar); }
  .cut { fill:var(--on-accent); }
  .blk { rx:var(--radius-lg); }
  .bar { rx:var(--radius-sm); }
  .words { position:absolute; left:32px; bottom:24px; max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.92; font-weight:900; letter-spacing:-3px; color:var(--text); }
  .tagline { margin:14px 0 0 4px; font-size:14px; line-height:20px; font-weight:600; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      music-mark 144x290 bled off the top (the brand blue at full value: music in light, the luminous #4B93FA in dark) · accent 120x192 (the gradient's other end) · cover-ink 184x240 bleeding off the right edge (text in light; a lifted slate #40454f in dark, 1.6:1 on bg, so it reads as a block while the name stays the brightest mass) — about 40% of 960x288
  arrangement one tall slab with two satellites, bottoms on one line space-6 (24px) above the edge, shared by the name block (bottom:24px), space-4 (16px) gutters; the blue slab stays solid, the brand's biggest colour field
  pattern     soft, friendly, large radii + a literal motif: the logo's equalizer bars as 24-wide pills (rx = radius-sm, half the width) — three on-accent bars on the violet block (the logo badge itself: white bars on a brand fill, in both themes), four across the ink block in cover-bar with one music-mark bar "playing" (the UI's now-playing mark). Seven units, under the usual dozen on purpose: a literal three- and four-bar mark reads as the logo only at the logo's count; cutting bars into the slab too turned the whole art into pattern and cost the blue its field (tried, rejected)
  scales      corners radius-lg (24px) on blocks, radius-sm (12px) on bars; gutters space-4; bar pitch 32px (space-8) in both blocks, bar groups inset space-4 in the violet block and space-5 in the ink block's visible 160px
-->
<rect class="music blk" x="24" y="-26" width="144" height="290"/>
<rect class="accent blk" x="184" y="72" width="120" height="192"/>
<rect class="ink blk" x="320" y="24" width="184" height="240"/>
<rect class="cut bar" x="200" y="136" width="24" height="64"/>
<rect class="cut bar" x="232" y="112" width="24" height="112"/>
<rect class="cut bar" x="264" y="128" width="24" height="80"/>
<rect class="gray bar" x="340" y="104" width="24" height="80"/>
<rect class="music bar" x="372" y="64" width="24" height="160"/>
<rect class="gray bar" x="404" y="88" width="24" height="112"/>
<rect class="gray bar" x="436" y="112" width="24" height="64"/>
</svg>
</div>
<div class="words">
<h1 class="name">DULI.KR</h1>
<p class="tagline">너 인디 좋아해? — 인디음악 커뮤니티</p>
</div>
</div>
</body>
</html>
