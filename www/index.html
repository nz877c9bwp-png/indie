<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>너 인디 좋아해?</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#E9ECEF; color:#363B42; font-family:-apple-system, sans-serif; text-align:center; }
  @media (prefers-color-scheme: dark){ body{ background:#2B2E33; color:#E4E6E9; } }
  button{ margin-top:16px; padding:10px 22px; border:none; border-radius:999px; background:#3182F6; color:#fff; font-size:15px; font-weight:700; }
</style>
</head>
<body style="visibility:hidden">
  <div>
    <p>인터넷 연결을 확인해 주세요.</p>
    <button onclick="location.replace('https://duli.kr')">다시 시도</button>
  </div>
  <script>
    // Capacitor는 외부 링크를 Safari로 넘기며 웹뷰 이동을 취소할 때(오프라인이 아닌데도) 이 페이지를 띄운다.
    // 네트워크가 살아 있으면 안내를 보여주지 않고 곧바로 이전 화면(앱)으로 돌아간다.
    fetch('https://duli.kr/?ping=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
      .then(() => history.length > 1 ? history.back() : location.replace('https://duli.kr'))
      .catch(() => { document.body.style.visibility = 'visible'; });
  </script>
</body>
</html>
