name: Auto Album Review

on:
  schedule:
    - cron: '32 */3 * * *'
  workflow_dispatch: {}

jobs:
  post-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Anthropic SDK
        run: npm install @anthropic-ai/sdk

      - name: Write and post a new album review
        run: node scripts/auto-album-review.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
