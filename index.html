<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너 인디 좋아해?</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #101113; --panel: #17181B; --panel-alt: #1B1D21;
    --border: #26282C; --text: #E7E5DC; --muted: #75787E;
    --muted-2: #4D4F53; --music: #E8542E; --music-hover: #cf4522;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard', sans-serif; font-size:14px; letter-spacing:-0.3px; }
  .display{font-family:'Pretendard', sans-serif; font-weight:800; letter-spacing:-1px;}
  a{color:inherit; text-decoration:none;}
  .tabular{font-variant-numeric:tabular-nums;}

  header{ border-bottom:1px solid var(--border); background:var(--panel); }
  .header-inner{ max-width:1180px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:24px; }
  .brand{ font-size:20px; white-space:nowrap; cursor:pointer; }
  .search{ flex:1; display:flex; max-width:420px; border:1px solid var(--border); background:var(--bg); border-radius:4px; overflow:hidden;}
  .search input{ flex:1; background:none; border:none; outline:none; color:var(--text); padding:9px 12px; font-size:13px; font-family:inherit; }
  .search button{ border:none; background:none; color:var(--muted); padding:0 12px; cursor:pointer; }
  .write-btn{ margin-left:auto; background:var(--music); color:#101113; font-weight:700; border:none; padding:9px 18px; cursor:pointer; font-size:13px; border-radius:4px; font-family:inherit; transition:0.2s;}
  .write-btn:hover { background:var(--music-hover); }

  .shell{ max-width:1180px; margin:0 auto; padding:20px; display:grid; grid-template-columns:230px 1fr; gap:24px; }
  @media (max-width:840px){ .shell{grid-template-columns:1fr;} .sidebar{order:2;} }

  .sidebar{ background:var(--panel); border:1px solid var(--border); align-self:start; padding:0 0 6px 0; border-radius:8px; overflow:hidden;}
  .cat-group{border-bottom:1px solid var(--border);}
  .cat-group:last-child{border-bottom:none;}
  .cat-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-weight:700; font-size:13px; background:var(--panel-alt); color:var(--text);}
  .board-list{list-style:none; margin:0; padding:6px 0;}
  .board-list li a{ display:block; padding:8px 16px; font-size:13px; color:var(--muted); transition:0.2s;}
  .board-list li a:hover, .board-list li a.active{color:var(--music); background:var(--bg); font-weight:600;}

  /* 핫게시판 영역 */
  .hot-board-container { display:flex; gap:12px; margin-bottom:24px; overflow-x:auto; padding-bottom:4px;}
  .hot-card { flex:1; min-width:200px; background:var(--panel); border:1px solid var(--music); padding:16px; border-radius:8px; cursor:pointer; transition:transform 0.2s; position:relative; overflow:hidden;}
  .hot-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(232,84,46,0.15);}
  .hot-badge { color:var(--music); font-weight:800; font-size:12px; margin-bottom:8px; display:inline-block;}
  .hot-title { font-weight:600; font-size:14.5px; color:var(--text); margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4;}
  .hot-stats { font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:center;}

  .board-title-row{ display:flex; align-items:baseline; justify-content:space-between; margin:0 0 12px; }
  .board-title-row h1{ font-size:19px; margin:0; font-weight:700; }

  /* 게시판 테이블 */
  .post-table{ width:100%; border-collapse:collapse; border-top:2px solid var(--border); border-bottom:1px solid var(--border); }
  .post-table th{ background:var(--panel); color:var(--muted); font-weight:600; font-size:12px; padding:10px; text-align:center; border-bottom:1px solid var(--border); }
  .post-table td{ padding:10px; vertical-align:middle; border-bottom:1px solid var(--border); font-size:13px;}
  .post-table tbody tr:hover{background:var(--panel-alt);}
  
  .col-num{width:50px; text-align:center; color:var(--muted-2);}
  .col-tag{width:90px; text-align:center;}
  .col-title{text-align:left;}
  .col-author{width:100px; text-align:center; color:var(--muted);}
  .col-date{width:80px; text-align:center; color:var(--muted);}
  .col-stats{width:60px; text-align:center; color:var(--muted); font-size:12px;}

  .tag{ display:inline-block; font-size:11px; font-weight:700; padding:4px 6px; color:#101113; background:var(--muted); border-radius:3px; white-space:nowrap;}
  .tag.hot { background:var(--music); color:#fff; }
  .title-cell a:hover { text-decoration: underline; color: var(--text); }
  .title-cell .rec-count { color:var(--music); font-weight:bold; font-size:12px; margin-left:6px;}

  /* ---------------- 디시인사이드 스타일 글 읽기 영역 ---------------- */
  #postViewSection { display: none; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:0; overflow:hidden;}
  .view-header { padding:20px 24px; border-bottom:1px solid var(--border); }
  .view-title { font-size:22px; font-weight:700; color:var(--text); margin:0 0 16px 0; line-height:1.4;}
  .view-meta { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); }
  .view-meta-left { display:flex; align-items:center; gap:12px; }
  .view-meta-right { display:flex; gap:16px; }
  
  .view-content-area { padding:30px 24px; min-height:300px; font-size:15px; line-height:1.7; color:#E7E5DC; white-space:pre-wrap; }
  
  .view-footer { padding:20px 24px; border-top:1px solid var(--border); display:flex; justify-content:center; align-items:center; flex-direction:column; gap:20px; background:var(--bg);}
  .btn-recommend { background:none; border:2px solid var(--music); color:var(--music); padding:12px 32px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer; transition:0.2s; font-family:inherit; display:flex; align-items:center; gap:8px;}
  .btn-recommend:hover { background:var(--music); color:#fff; }
  
  .view-controls { width:100%; display:flex; justify-content:flex-end; padding-top:10px;}
  .btn-list { background:var(--panel-alt); color:var(--text); border:1px solid var(--border); padding:8px 20px; border-radius:4px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;}
  .btn-list:hover { background:var(--border); }

  /* ---------------- 글쓰기 모달 ---------------- */
  .modal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); justify-content:center; align-items:center; z-index:100; backdrop-filter:blur(3px);}
  .modal-content{ background:var(--panel); border:1px solid var(--border); width:90%; max-width:550px; padding:24px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .modal-content h2{ margin-top:0; font-size:18px; color:var(--text); margin-bottom:16px;}
  .modal-content input, .modal-content select, .modal-content textarea{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:10px; margin-bottom:12px; font-family:inherit; border-radius:4px; font-size:14px;}
  .modal-content textarea{ height:200px; resize:none; line-height:1.6; }
  .modal-btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-btns button{ border:none; padding:10px 18px; cursor:pointer; font-weight:700; font-family:inherit; border-radius:4px; font-size:13px;}
  .btn-save{ background:var(--music); color:#101113; }
  .btn-cancel{ background:var(--border); color:var(--text); }
  
  optgroup { background:var(--panel); color:var(--text); font-weight:bold; }
  option { background:var(--bg); color:var(--text); font-weight:normal; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand display" onclick="location.reload()">너 <span style="color:var(--music)">인디</span> 좋아해<span style="color:var(--music)">?</span></div>
    <div class="search"><input type="text" placeholder="게시글 검색"><button>🔍</button></div>
    <button class="write-btn" id="openModalBtn">글쓰기</button>
  </div>
</header>

<div class="shell">
  <!-- 새롭게 개편된 사이드바 분류 -->
  <aside class="sidebar">
    <div class="cat-group">
      <ul class="board-list" style="padding-top:6px;">
        <li><a href="javascript:void(0);" class="active" onclick="changeBoard('전체')">🌟 전체 게시판</a></li>
      </ul>
    </div>

    <div class="cat-group">
      <div class="cat-head"><span>🎵 너 인디 좋아해?</span></div>
      <ul class="board-list">
        <li><a href="javascript:void(0);" onclick="changeBoard('국내 인디')">국내 인디</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('해외 인디')">해외 인디</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('앨범/곡 추천')">앨범/곡 추천</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('앨범 평가')">앨범 평가</a></li>
      </ul>
    </div>

    <div class="cat-group">
      <div class="cat-head"><span>🎤 너 공연 좋아해?</span></div>
      <ul class="board-list">
        <li><a href="javascript:void(0);" onclick="changeBoard('공연 정보')">공연 정보</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('공연 후기')">공연 후기</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('같이 갈 사람')">같이 갈 사람</a></li>
      </ul>
    </div>

    <div class="cat-group">
      <div class="cat-head"><span>🎧 너 자작곡 좋아해?</span></div>
      <ul class="board-list">
        <li><a href="javascript:void(0);" onclick="changeBoard('자작곡')">자작곡</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('데모')">데모</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('밴드 홍보')">밴드 홍보</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('피드백')">피드백</a></li>
      </ul>
    </div>

    <div class="cat-group">
      <div class="cat-head"><span>💬 너 수다 좋아해?</span></div>
      <ul class="board-list">
        <li><a href="javascript:void(0);" onclick="changeBoard('자유')">자유</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('야구')">야구</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('음반')">음반</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('장터')">장터</a></li>
        <li><a href="javascript:void(0);" onclick="changeBoard('자랑')">자랑</a></li>
      </ul>
    </div>
  </aside>

  <main>
    <div id="boardSection">
      <div class="board-title-row" style="margin-top:0;">
        <h1 style="color:var(--music); font-size:16px;">🔥 핫게시판 (HOT)</h1>
      </div>
      <div class="hot-board-container" id="hotBoard">
        <!-- 핫게시글 렌더링 -->
      </div>

      <div class="board-title-row">
        <h1 id="boardTitle">🌟 전체 게시판</h1>
      </div>

      <table class="post-table">
        <thead>
          <tr>
            <th class="col-num">번호</th>
            <th class="col-tag">분류</th>
            <th class="col-title">제목</th>
            <th class="col-author">글쓴이</th>
            <th class="col-date">날짜</th>
            <th class="col-stats">조회</th>
            <th class="col-stats">추천</th>
          </tr>
        </thead>
        <tbody id="postList">
          <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--muted);">게시글을 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 글 읽기 영역 -->
    <div id="postViewSection">
      <div class="view-header">
        <h2 class="view-title" id="readTitle"></h2>
        <div class="view-meta">
          <div class="view-meta-left">
            <span id="readTag" class="tag"></span>
            <span id="readAuthor" style="color:var(--text); font-weight:600;"></span>
            <span id="readDate"></span>
          </div>
          <div class="view-meta-right">
            <span>조회 <span id="readViews" style="color:var(--text); font-weight:600;">0</span></span>
            <span>추천 <span id="readRecs" style="color:var(--music); font-weight:600;">0</span></span>
          </div>
        </div>
      </div>
      <div class="view-content-area" id="readContent"></div>
      <div class="view-footer">
        <button class="btn-recommend" id="recommendBtn">👍 추천 <span id="btnRecCount">0</span></button>
        <div class="view-controls">
          <button class="btn-list" onclick="backToList()">목록으로</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 글쓰기 모달 -->
<div class="modal" id="writeModal">
  <div class="modal-content">
    <h2>새 글 작성하기</h2>
    <!-- 분류 항목 선택지 업데이트 -->
    <select id="postTag">
      <optgroup label="🎵 너 인디 좋아해?">
        <option value="국내 인디">국내 인디</option>
        <option value="해외 인디">해외 인디</option>
        <option value="앨범/곡 추천">앨범/곡 추천</option>
        <option value="앨범 평가">앨범 평가</option>
      </optgroup>
      <optgroup label="🎤 너 공연 좋아해?">
        <option value="공연 정보">공연 정보</option>
        <option value="공연 후기">공연 후기</option>
        <option value="같이 갈 사람">같이 갈 사람</option>
      </optgroup>
      <optgroup label="🎧 너 자작곡 좋아해?">
        <option value="자작곡">자작곡</option>
        <option value="데모">데모</option>
        <option value="밴드 홍보">밴드 홍보</option>
        <option value="피드백">피드백</option>
      </optgroup>
      <optgroup label="💬 너 수다 좋아해?">
        <option value="자유">자유</option>
        <option value="야구">야구</option>
        <option value="음반">음반</option>
        <option value="장터">장터</option>
        <option value="자랑">자랑</option>
      </optgroup>
    </select>
    <input type="text" id="postAuthor" placeholder="작성자 이름">
    <input type="text" id="postTitle" placeholder="제목을 입력하세요">
    <textarea id="postContent" placeholder="내용을 입력하세요"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" id="closeModalBtn">취소</button>
      <button class="btn-save" id="savePostBtn">등록하기</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://jvitmimabxupkhrksudu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2aXRtaW1hYnh1cGtocmtzdWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTU2NDEsImV4cCI6MjEwNDUzMTY0MX0.AD_7HM1C6xhKbXKKOwF6WSRfM1tPHfpj4McmMTJ0jNY';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentPosts = [];
  let currentCategory = '전체'; 
  let currentReadPostId = null;

  async function fetchPosts() {
    const { data, error } = await client.from('posts').select('*').order('id', { ascending: false });
    if (!error && data) { currentPosts = data; }
    renderPosts(); 
    renderHotBoard();
  }

  function renderHotBoard() {
    const hotBoard = document.getElementById('hotBoard');
    let hotPosts = [...currentPosts].filter(p => p.recs > 0 || p.views > 5)
      .sort((a, b) => (b.recs !== a.recs) ? b.recs - a.recs : b.views - a.views).slice(0, 3);

    if(hotPosts.length === 0) {
      hotBoard.innerHTML = '<div style="color:var(--muted); font-size:13px; padding:10px;">아직 핫게시글이 없습니다. 글을 읽고 추천을 눌러보세요!</div>';
      return;
    }
    hotBoard.innerHTML = hotPosts.map((post, index) => `
      <div class="hot-card" onclick="openPostView(${post.id})">
        <span class="hot-badge">HOT ${index + 1}</span>
        <div class="hot-title">${post.title}</div>
        <div class="hot-stats">
          <span>👀 ${post.views || 0}</span>
          <span style="color:var(--music)">👍 ${post.recs || 0}</span>
          <span style="margin-left:auto;">${post.author || '익명'}</span>
        </div>
      </div>
    `).join('');
  }

  function renderPosts() {
    const tbody = document.getElementById('postList');
    let filteredPosts = currentCategory !== '전체' ? currentPosts.filter(post => post.tag === currentCategory) : currentPosts;

    if (filteredPosts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--muted);">등록된 게시글이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = filteredPosts.map(post => {
      const date = new Date(post.created_at).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
      const recBadge = (post.recs && post.recs > 0) ? `<span class="rec-count">[${post.recs}]</span>` : '';
      return `
        <tr>
          <td class="col-num tabular">${post.id}</td>
          <td class="col-tag"><span class="tag ${post.recs >= 3 ? 'hot' : ''}">${post.tag}</span></td>
          <td class="col-title title-cell"><a href="javascript:void(0);" onclick="openPostView(${post.id})">${post.title}</a>${recBadge}</td>
          <td class="col-author">${post.author || '익명'}</td>
          <td class="col-date">${date}</td>
          <td class="col-stats tabular">${post.views || 0}</td>
          <td class="col-stats tabular" style="color:var(--music); font-weight:600;">${post.recs || 0}</td>
        </tr>
      `;
    }).join('');
  }

  function changeBoard(category) {
    backToList(); 
    currentCategory = category;
    document.getElementById('boardTitle').innerText = category === '전체' ? '🌟 전체 게시판' : category + ' 게시판';
    
    document.querySelectorAll('.sidebar a').forEach(link => {
      if (link.getAttribute('onclick').includes(`'${category}'`)) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
    renderPosts(); 
  }

  async function openPostView(postId) {
    const post = currentPosts.find(p => p.id === postId);
    if(!post) return;

    currentReadPostId = postId;
    document.getElementById('readTitle').textContent = post.title;
    document.getElementById('readTag').textContent = post.tag;
    document.getElementById('readAuthor').textContent = post.author || '익명';
    document.getElementById('readDate').textContent = new Date(post.created_at).toLocaleString('ko-KR');
    document.getElementById('readContent').textContent = post.content;
    
    post.views = (post.views || 0) + 1;
    document.getElementById('readViews').textContent = post.views;
    document.getElementById('readRecs').textContent = post.recs || 0;
    document.getElementById('btnRecCount').textContent = post.recs || 0;
    
    document.getElementById('boardSection').style.display = 'none';
    document.getElementById('postViewSection').style.display = 'block';
    window.scrollTo(0, 0); 

    await client.from('posts').update({ views: post.views }).eq('id', postId);
    renderHotBoard();
  }

  function backToList() {
    document.getElementById('postViewSection').style.display = 'none';
    document.getElementById('boardSection').style.display = 'block';
    renderPosts(); 
  }

  document.getElementById('recommendBtn').addEventListener('click', async () => {
    if(!currentReadPostId) return;
    if (localStorage.getItem('rec_' + currentReadPostId)) { alert('이미 추천한 게시글입니다.'); return; }

    const post = currentPosts.find(p => p.id === currentReadPostId);
    if(!post) return;

    post.recs = (post.recs || 0) + 1;
    document.getElementById('readRecs').textContent = post.recs;
    document.getElementById('btnRecCount').textContent = post.recs;
    localStorage.setItem('rec_' + currentReadPostId, 'true'); 

    alert('게시글을 추천했습니다! 👍');
    await client.from('posts').update({ recs: post.recs }).eq('id', currentReadPostId);
  });

  document.getElementById('savePostBtn').addEventListener('click', async () => {
    const tag = document.getElementById('postTag').value;
    const author = document.getElementById('postAuthor').value || '익명';
    const title = document.getElementById('postTitle').value;
    const content = document.getElementById('postContent').value;

    if (!title.trim()) { alert('제목을 입력해주세요.'); return; }

    const { error } = await client.from('posts').insert([{ tag, author, title, content }]);
    if (error) { alert('글 등록 실패: ' + error.message); } 
    else {
      alert('글이 등록되었습니다!');
      document.getElementById('writeModal').style.display = 'none';
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      backToList(); 
      fetchPosts(); 
    }
  });

  document.getElementById('openModalBtn').onclick = () => document.getElementById('writeModal').style.display = 'flex';
  document.getElementById('closeModalBtn').onclick = () => document.getElementById('writeModal').style.display = 'none';

  fetchPosts();
</script>

</body>
</html>
