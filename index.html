<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너 인디 좋아해?</title>
<!-- 세련된 프리텐다드 폰트 적용 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #101113;
    --panel: #17181B;
    --panel-alt: #1B1D21;
    --border: #26282C;
    --text: #E7E5DC;
    --muted: #75787E;
    --muted-2: #4D4F53;
    --music: #E8542E;
    --gig: #1F8A8F;
    --demo: #C23FA5;
    --talk: #D6A61A;
  }
  *{box-sizing:border-box;}
  
  /* 글씨체 설정 */
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Pretendard', sans-serif; font-size:14px; letter-spacing:-0.3px;
  }
  .display{font-family:'Pretendard', sans-serif; font-weight:800; letter-spacing:-1px;}
  
  a{color:inherit; text-decoration:none;}
  .tabular{font-variant-numeric:tabular-nums;}

  header{ border-bottom:1px solid var(--border); background:var(--panel); }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:24px;
  }
  .brand{ font-size:20px; white-space:nowrap; cursor:pointer; }
  .brand .dot{color:var(--music);}
  .search{
    flex:1; display:flex; max-width:420px;
    border:1px solid var(--border); background:var(--bg);
  }
  .search input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    padding:8px 10px; font-size:13px; font-family:inherit;
  }
  .search button{ border:none; background:none; color:var(--muted); padding:0 12px; cursor:pointer; }
  .write-btn{
    margin-left:auto; background:var(--music); color:#101113; font-weight:700;
    border:none; padding:9px 18px; cursor:pointer; font-size:13px; font-family:inherit;
  }

  .shell{
    max-width:1180px; margin:0 auto; padding:20px;
    display:grid; grid-template-columns:230px 1fr; gap:20px;
  }
  @media (max-width:840px){ .shell{grid-template-columns:1fr;} .sidebar{order:2;} }

  .sidebar{ background:var(--panel); border:1px solid var(--border); align-self:start; padding:6px 0; }
  .cat-group{border-bottom:1px solid var(--border);}
  .cat-group:last-child{border-bottom:none;}
  .cat-head{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; font-weight:700; font-size:13px; }
  .cat-head .swatch{ width:8px; height:8px; display:inline-block; margin-right:8px; border-radius:1px; }
  .board-list{list-style:none; margin:0; padding:0 0 8px;}
  .board-list li a{ display:flex; justify-content:space-between; padding:6px 14px 6px 30px; font-size:12.5px; color:var(--muted); }
  .board-list li a:hover, .board-list li a.active{color:var(--text); background:var(--panel-alt);}

  .hot-strip{
    border:1px solid var(--border); background:var(--panel);
    padding:10px 14px; display:flex; align-items:center; gap:14px;
    font-size:12.5px; margin-bottom:14px; overflow:hidden;
  }
  .hot-strip .label{ color:var(--music); font-weight:700; white-space:nowrap; }

  .board-title-row{ display:flex; align-items:baseline; gap:10px; margin:2px 0 12px; }
  .board-title-row h1{ font-size:19px; margin:0; font-weight:700; }

  .post-table{ width:100%; border-collapse:collapse; border:1px solid var(--border); }
  .post-table thead th{
    background:var(--panel); color:var(--muted); font-weight:600;
    font-size:11.5px; padding:9px 10px; text-align:left; border-bottom:1px solid var(--border);
  }
  .post-table th.num, .post-table td.num{width:50px; text-align:center; color:var(--muted-2);}
  .post-table th.meta, .post-table td.meta{width:80px; text-align:center;}
  .post-table tbody tr{ border-bottom:1px solid var(--border); }
  .post-table tbody tr:hover{background:var(--panel-alt);}
  .post-table td{padding:9px 10px; vertical-align:middle;}
  .tag{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 6px; margin-right:6px; color:#101113; background:var(--music); border-radius:2px; }
  .title-cell a:hover { text-decoration: underline; color: var(--text); }
  .author{color:var(--muted);}
  .date, .views, .recs{color:var(--muted); text-align:center; font-size:12px;}

  /* ---------------- 모달 (팝업) 공통 ---------------- */
  .modal{
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:100;
  }
  .modal-content{
    background:var(--panel); border:1px solid var(--border); width:90%; max-width:500px; padding:24px; border-radius:8px;
  }
  .modal-content h2{ margin-top:0; font-size:18px; color:var(--text); margin-bottom:16px;}
  .modal-content input, .modal-content select, .modal-content textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:10px; margin-bottom:12px; font-family:inherit; border-radius:4px;
  }
  .modal-content textarea{ height:120px; resize:none; line-height:1.5; }
  .modal-btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}
  .modal-btns button{ border:none; padding:9px 16px; cursor:pointer; font-weight:700; font-family:inherit; border-radius:4px; }
  .btn-save{ background:var(--music); color:#101113; }
  .btn-cancel{ background:var(--border); color:var(--text); }

  /* 글 읽기 본문 영역 */
  #readContent {
    min-height: 120px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    white-space: pre-wrap; /* 줄바꿈 유지 */
    margin-bottom: 16px;
    line-height: 1.6;
    color: #e0e0e0;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand display">너 인디 좋아해<span class="dot">?</span></div>
    <div class="search">
      <input type="text" placeholder="게시글 검색">
      <button>🔍</button>
    </div>
    <button class="write-btn" id="openModalBtn">글쓰기</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="cat-group">
      <div class="cat-head"><span><span class="swatch" style="background:var(--music)"></span>너 인디 좋아해?</span></div>
      <ul class="board-list">
        <li><a href="#" class="active">전체 게시판</a></li>
      </ul>
    </div>
  </aside>

  <main>
    <div class="hot-strip">
      <span class="label">🔥 게시판 연동 완료</span>
      <span>글 제목을 클릭하면 작성한 내용을 볼 수 있습니다!</span>
    </div>

    <div class="board-title-row">
      <h1>전체 게시판</h1>
    </div>

    <table class="post-table">
      <thead>
        <tr>
          <th class="num">번호</th>
          <th class="meta">분류</th>
          <th>제목</th>
          <th class="meta">글쓴이</th>
          <th class="meta">날짜</th>
        </tr>
      </thead>
      <tbody id="postList">
        <tr><td colspan="5" style="text-align:center; padding:20px; color:var(--muted);">게시글을 불러오는 중...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<!-- 글쓰기 모달 -->
<div class="modal" id="writeModal">
  <div class="modal-content">
    <h2>새 글 작성하기</h2>
    <select id="postTag">
      <option value="국내인디">국내인디</option>
      <option value="해외인디">해외인디</option>
      <option value="공연정보">공연정보</option>
      <option value="자작곡">자작곡</option>
      <option value="자유">자유</option>
    </select>
    <input type="text" id="postAuthor" placeholder="작성자 이름">
    <input type="text" id="postTitle" placeholder="제목을 입력하세요">
    <textarea id="postContent" placeholder="내용을 입력하세요"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" id="closeModalBtn">취소</button>
      <button class="btn-save" id="savePostBtn">등록하기</button>
    </div>
  </div>
</div>

<!-- 글 읽기 모달 (새로 추가됨) -->
<div class="modal" id="readModal">
  <div class="modal-content">
    <h2 id="readTitle" style="margin-bottom:8px;"></h2>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:16px;">
      <span id="readTag" class="tag" style="margin-right:8px;"></span>
      작성자: <span id="readAuthor" style="color:var(--text);"></span> &nbsp;|&nbsp; 
      작성일: <span id="readDate"></span>
    </div>
    <div id="readContent"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="closeReadModalBtn">닫기</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://jvitmimabxupkhrksudu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2aXRtaW1hYnh1cGtocmtzdWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTU2NDEsImV4cCI6MjEwNDUzMTY0MX0.AD_7HM1C6xhKbXKKOwF6WSRfM1tPHfpj4McmMTJ0jNY';
  
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 불러온 게시글 데이터를 임시 저장해둘 변수
  let currentPosts = [];

  // 게시글 목록 가져오기
  async function fetchPosts() {
    const { data, error } = await client
      .from('posts')
      .select('*')
      .order('id', { ascending: false });

    const tbody = document.getElementById('postList');
    if (error || !data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--muted);">등록된 게시글이 없습니다. 첫 글을 작성해 보세요!</td></tr>';
      return;
    }

    currentPosts = data; // 가져온 데이터를 저장해둠

    tbody.innerHTML = data.map(post => {
      const date = new Date(post.created_at).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
      // 제목 클릭 시 openReadModal 함수 실행
      return `
        <tr>
          <td class="num tabular">${post.id}</td>
          <td class="meta"><span class="tag">${post.tag}</span></td>
          <td class="title-cell"><a href="javascript:void(0);" onclick="openReadModal(${post.id})">${post.title}</a></td>
          <td class="author">${post.author || '익명'}</td>
          <td class="date">${date}</td>
        </tr>
      `;
    }).join('');
  }

  // 글 읽기 모달 열기 함수
  function openReadModal(postId) {
    // 저장해둔 데이터에서 클릭한 글 번호와 일치하는 데이터를 찾음
    const post = currentPosts.find(p => p.id === postId);
    if(post) {
      document.getElementById('readTitle').textContent = post.title;
      document.getElementById('readTag').textContent = post.tag;
      document.getElementById('readAuthor').textContent = post.author || '익명';
      document.getElementById('readDate').textContent = new Date(post.created_at).toLocaleDateString('ko-KR');
      document.getElementById('readContent').textContent = post.content; // 글 내용 표시
      
      document.getElementById('readModal').style.display = 'flex'; // 모달 띄우기
    }
  }

  // 글쓰기 기능
  document.getElementById('savePostBtn').addEventListener('click', async () => {
    const tag = document.getElementById('postTag').value;
    const author = document.getElementById('postAuthor').value || '익명';
    const title = document.getElementById('postTitle').value;
    const content = document.getElementById('postContent').value;

    if (!title.trim()) {
      alert('제목을 입력해주세요.');
      return;
    }

    const { error } = await client.from('posts').insert([{ tag, author, title, content }]);

    if (error) {
      alert('글 등록 실패: ' + error.message);
    } else {
      alert('글이 성공적으로 등록되었습니다!');
      document.getElementById('writeModal').style.display = 'none';
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      fetchPosts(); // 글 목록 새로고침
    }
  });

  // 버튼 클릭 시 팝업 열고 닫기 이벤트들
  document.getElementById('openModalBtn').onclick = () => document.getElementById('writeModal').style.display = 'flex';
  document.getElementById('closeModalBtn').onclick = () => document.getElementById('writeModal').style.display = 'none';
  document.getElementById('closeReadModalBtn').onclick = () => document.getElementById('readModal').style.display = 'none';

  // 처음 접속 시 글 목록 불러오기
  fetchPosts();
</script>

</body>
</html>
