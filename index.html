<!-- 교체할 부분: 앨범 검색창 UI -->
        <div id="albumSearchWrap">
          <div style="font-weight:bold; margin-bottom:8px; color:var(--special);">🎵 평가할 앨범 검색 (Apple Music)</div>
          
          <!-- 여기서부터 -->
          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <select id="searchType" style="background:var(--bg); border:1px solid var(--border); color:var(--text); padding:0 10px; border-radius:4px; outline:none; font-family:inherit;">
              <option value="all">통합검색</option>
              <option value="artistTerm">가수명만</option>
              <option value="albumTerm">앨범명만</option>
            </select>
            <input type="text" id="albumQuery" placeholder="예: 부활, 잔나비, 전설 (하나만 칠 것)" style="margin-bottom:0; flex:1;">
            <button type="button" id="btnSearchAlbum" style="background:var(--special); color:var(--bg); border:none; padding:0 20px; border-radius:4px; font-weight:bold; cursor:pointer; white-space:nowrap;">검색</button>
          </div>
          <!-- 여기까지 교체 -->

          <div id="albumResults" class="search-result-row"></div>
